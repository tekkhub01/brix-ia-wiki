# Snippet da inserire nel server block di /etc/nginx/sites-available/funnel
# PRIMA della `location /` finale che ritorna 404.
#
# Raggiungibile da entrambi i frontend che puntano a nginx :8090:
#   https://share.transizione-digital.it/wiki/          (Cloudflare Tunnel)
#   https://brix-ia-linux.tail216abe.ts.net:10000/wiki/ (Tailscale Funnel)
#
# NOTA: si usa `root /srv/www` e non `alias`, perche' la directory si
# chiama gia' `wiki`. Con alias le location regex qui sotto non
# risolverebbero il path correttamente.
#
# La wiki NON sta sotto /srv/www/static: quella e' l'area effimera del
# janitor md2html, che pota per TTL 5 giorni e cap 10 directory. Messa
# li' verrebbe sfrattata.

# ── Asset con hash nel nome: immutabili, cache lunga ──────────────
# Quartz emette component-<hash>.css / resource-<hash>.js: cambiando il
# contenuto cambia il nome, quindi si possono cachare aggressivamente.
# Deliberatamente NON include static/contentIndex.json, che ha nome
# stabile e cambia a ogni build (e' l'indice di ricerca).
location ~ ^/wiki/.+-[0-9a-f]{8}\.(?:css|js)$ {
    root /srv/www;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
}

# ── BRIX-IA Wiki (statico, permanente) ────────────────────────────
location /wiki/ {
    root /srv/www;
    autoindex off;
    try_files $uri $uri/ $uri.html $uri/index.html =404;

    # Pubblica, ed embeddabile da Telegram ma non altrove.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /wiki {
    return 301 /wiki/;
}
